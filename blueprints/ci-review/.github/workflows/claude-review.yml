# UNEXECUTED EXAMPLE. This workflow has never run on GitHub. The script it calls was tested locally, and its
# posting step only as a dry run. Test it on a throwaway repository before relying on it.
#
# Copy to .github/workflows/, along with scripts/ and schemas/ into .github/ci-review/, and add the
# ANTHROPIC_API_KEY secret. Check the action versions before use. Remove --post for a dry run on the first try.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # A pull request from a fork gets no secrets, and its diff is untrusted input.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      # Findings from earlier pushes of this pull request. A cache key with a run id always saves a new entry.
      - uses: actions/cache@v4
        with:
          path: .ci/findings.json
          key: claude-findings-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: claude-findings-${{ github.event.pull_request.number }}-

      - name: Review
        run: >
          node .github/ci-review/scripts/ci-review.js review
          --base origin/${{ github.base_ref }}
          --store .ci/findings.json
          --repo ${{ github.repository }}
          --pr ${{ github.event.pull_request.number }}
          --commit ${{ github.event.pull_request.head.sha }}
          --fail-on critical
          --post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
